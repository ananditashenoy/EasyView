<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; font-size: 18px; width: 280px; padding: 16px; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    label { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; cursor: pointer; }
    input[type="checkbox"] { width: 24px; height: 24px; }
    .slider-label { display: block; margin-bottom: 6px; }
    input[type="range"] { width: 100%; height: 24px; margin-bottom: 20px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>EasyView</h1>

  <label for="textSize" class="slider-label">Text size: <strong id="textSizeValue">125%</strong></label>
  <input type="range" id="textSize" min="100" max="200" step="25" value="125">

  <label><input type="checkbox" id="highContrast"> High contrast</label>
  <label><input type="checkbox" id="bigButtons"> Bigger buttons</label>
  <label><input type="checkbox" id="hoverZoom"> Magnify text on hover</label>

  <script src="popup.js"></script>
</body>
</html>
